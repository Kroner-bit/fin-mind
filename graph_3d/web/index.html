<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinMind // 3D Live Knowledge Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20261002_clean_live">
</head>
<body>
  <!-- Fullscreen 3D WebGL Canvas -->
  <div id="canvas-container"></div>

  <!-- Minimalist Floating Apple Glass Pill Menu (Top Center) -->
  <div class="floating-hud">
    <div class="minimal-pill-bar">
      
      <!-- Brand & Status -->
      <div class="pill-section brand-section">
        <span class="live-pulse-dot" id="live-dot" title="Élő GPU Render Aktív"></span>
        <span class="brand-title">FinMind 3D</span>
      </div>

      <div class="pill-divider"></div>

      <!-- FPS Counter -->
      <div class="pill-section">
        <span class="fps-value" id="disp-fps">60 FPS</span>
      </div>

      <div class="pill-divider"></div>

      <!-- Live Counts -->
      <div class="pill-section count-section">
        <span class="count-number" id="disp-nodes">0</span>
        <span class="count-label">csomópont</span>
      </div>

      <div class="pill-divider"></div>

      <!-- Auto-Sync Toggle Pill -->
      <button id="btn-toggle-sync" class="pill-btn active" title="Automatikus szinkronizáció a háttérben futó PDF feldolgozóval">
        <span class="sync-indicator"></span>
        <span class="btn-label" id="label-sync">Auto-Sync ON</span>
      </button>

      <!-- Rotation Toggle Pill -->
      <button id="btn-toggle-rotate" class="pill-btn active" title="Galaktikus forgás be/ki">
        <span class="rotate-symbol">↺</span>
        <span class="btn-label" id="label-rotate">Forgás</span>
      </button>

      <!-- Reset View -->
      <button id="btn-reset-view" class="pill-btn icon-only" title="Kamera alaphelyzetbe (R billentyű)">
        <span>🎯</span>
      </button>

    </div>
  </div>

  <!-- Minimal Floating Hover Tooltip -->
  <div id="hover-tooltip" class="floating-tooltip" style="display: none;">
    <div class="tooltip-badge" id="tooltip-badge">PAPER</div>
    <div class="tooltip-title" id="tooltip-title">Title</div>
    <div class="tooltip-sub" id="tooltip-sub">2024 • Quantitative Finance</div>
  </div>

  <!-- Arrival Toast (Bottom Center - Pops up with animation when new items arrive) -->
  <div id="arrival-toast" class="arrival-toast" style="display: none;">
    <span class="toast-star">✨</span>
    <div class="toast-content">
      <div class="toast-heading">ÚJ TANULMÁNY ÉRKEZETT</div>
      <div class="toast-title" id="toast-title">Title...</div>
    </div>
  </div>

  <!-- VENDOR LIBRARIES (100% LOCAL & OFFLINE) -->
  <script src="/static/vendor/three.min.js"></script>
  <script src="/static/vendor/OrbitControls.js"></script>

  <!-- APPLICATION ENGINE & LOGIC -->
  <script src="/static/graph_engine.js?v=20261002_clean_live"></script>
  <script src="/static/app.js?v=20261002_clean_live"></script>
</body>
</html>
